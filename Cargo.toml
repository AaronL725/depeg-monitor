[package]
name = "depeg-monitor"
version = "0.1.0"
edition = "2021"
publish = false

# Only enable the five CEX adapters; ccxt's all-exchange defaults are too large.
[dependencies]
ccxt-pro = { version = "=4.5.84", default-features = false, features = ["binance", "okx", "bitget", "bybit", "gate"] }
ccxt-base = { version = "=4.5.84", default-features = false, features = ["binance", "okx", "bitget", "bybit", "gate"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"

[profile.dev]
debug = 0
